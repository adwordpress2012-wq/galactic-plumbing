<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" fill="none" role="img" aria-label="Luke from Galactic Plumbing beside the Galactic Plumbing van">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#f5faff"/>
      <stop offset="100%" stop-color="#e8f3ff"/>
    </linearGradient>
    <linearGradient id="uniform" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#2b7de9"/>
      <stop offset="100%" stop-color="#1565d8"/>
    </linearGradient>
    <linearGradient id="vanBody" x1="0" y1="0.5" x2="1" y2="0.5">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f0f7ff"/>
    </linearGradient>
    <linearGradient id="vanStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="50%" stop-color="#1565d8"/>
      <stop offset="100%" stop-color="#2b7de9"/>
    </linearGradient>
  </defs>

  <rect width="640" height="720" fill="url(#bg)"/>
  <ellipse cx="320" cy="640" rx="280" ry="36" fill="#0a2540" opacity="0.05"/>

  <!-- Galactic van (right) -->
  <g transform="translate(248 268)">
    <rect x="0" y="88" width="320" height="118" rx="14" fill="url(#vanBody)" stroke="#c5daf0" stroke-width="2"/>
    <rect x="12" y="100" width="296" height="36" rx="6" fill="url(#vanStripe)"/>
    <text x="160" y="126" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">GALACTIC PLUMBING</text>
    <rect x="24" y="148" width="88" height="44" rx="8" fill="#0a2540"/>
    <text x="68" y="176" text-anchor="middle" fill="#93c5fd" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="800">G</text>
    <rect x="200" y="148" width="96" height="52" rx="8" fill="#e8f3ff" stroke="#c5daf0" stroke-width="1.5"/>
    <rect x="212" y="160" width="72" height="28" rx="4" fill="#1565d8" opacity="0.15"/>
    <circle cx="72" cy="214" r="26" fill="#0a2540" opacity="0.85"/>
    <circle cx="72" cy="214" r="14" fill="#64748b"/>
    <circle cx="248" cy="214" r="26" fill="#0a2540" opacity="0.85"/>
    <circle cx="248" cy="214" r="14" fill="#64748b"/>
    <path d="M280 88h40l28 48H280V88z" fill="#ffffff" stroke="#c5daf0" stroke-width="2"/>
    <rect x="288" y="96" width="52" height="32" rx="4" fill="#e8f3ff" stroke="#c5daf0"/>
  </g>

  <!-- Luke — smiling plumber -->
  <g transform="translate(48 120)">
    <!-- legs -->
    <path d="M108 420h52l8 88H100l8-88z" fill="#0a2540"/>
    <path d="M168 420h52l8 88h-60l8-88z" fill="#0a2540"/>
    <!-- torso / uniform -->
    <path d="M88 248c0-12 88-12 176 0v196H88V248z" fill="url(#uniform)"/>
    <rect x="108" y="292" width="136" height="52" rx="8" fill="#0a2540" opacity="0.92"/>
    <text x="176" y="326" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1">GALACTIC</text>
    <!-- arms -->
    <path d="M72 268c-28 8-40 52-32 88 8 36 40 48 56 28" fill="#1565d8" stroke="#134e84" stroke-width="2"/>
    <path d="M280 268c28 8 40 52 32 88-8 36-40 48-56 28" fill="#1565d8" stroke="#134e84" stroke-width="2"/>
    <!-- neck -->
    <rect x="148" y="218" width="56" height="36" rx="10" fill="#f4c9a8"/>
    <!-- head -->
    <ellipse cx="176" cy="178" rx="72" ry="78" fill="#f4c9a8"/>
    <!-- hair -->
    <path d="M112 168c8-44 72-52 96-28 20 20 16 52 8 72-24-8-52-12-80-4-8-24-12-28-24-40z" fill="#3d2914"/>
    <!-- eyes -->
    <ellipse cx="152" cy="168" rx="8" ry="10" fill="#1e293b"/>
    <ellipse cx="200" cy="168" rx="8" ry="10" fill="#1e293b"/>
    <circle cx="154" cy="165" r="2.5" fill="#ffffff"/>
    <circle cx="202" cy="165" r="2.5" fill="#ffffff"/>
    <!-- smile -->
    <path d="M144 198c12 18 56 18 68 0" stroke="#b45309" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>

  <!-- subtle ground line -->
  <rect x="0" y="598" width="640" height="122" fill="#0a2540" opacity="0.03"/>
  <text x="320" y="688" text-anchor="middle" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Western Sydney · Licensed &amp; Insured</text>
</svg>
